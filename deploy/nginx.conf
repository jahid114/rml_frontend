# nginx configuration for refugeemigrationlab.org
#
# The frontend is a static Vite build served from `dist/`. It is a
# client-side-routed SPA (react-router createBrowserRouter), so routes like
# /about, /team/nasir-uddin or /admin/login have NO file on disk — they only
# exist inside the JavaScript bundle.
#
# Without `try_files ... /index.html` every one of those paths returns
# nginx's 404 page, which is why only the homepage was reachable.
#
# Caddy terminates TLS on :443 and reverse-proxies to this nginx instance,
# so the SPA fallback has to live HERE, not in the Caddyfile.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/refugeemigrationlab.org
#   sudo ln -s /etc/nginx/sites-available/refugeemigrationlab.org \
#            /etc/nginx/sites-enabled/refugeemigrationlab.org
#   sudo nginx -t && sudo systemctl reload nginx
#
# If Coolify manages the proxy, the equivalent file is
# /data/coolify/proxy/dynamic/<app>.conf — edit it there and reload
# Coolify's proxy instead of hand-writing this file.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name refugeemigrationlab.org;

    # --- Where the built frontend lives -------------------------------
    # Confirm the real path with:  ls -la <dir>
    root /var/www/rml;
    index index.html;

    # --- SPA fallback --------------------------------------------------
    # THE critical line. Any path that is not a real file falls back to
    # index.html so the client-side router can resolve it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Admin ---------------------------------------------------------
    # The CMS must never be indexed. Use a header instead of a robots.txt
    # Disallow: robots.txt blocks the crawler from ever fetching the page,
    # so it can never see the noindex tag and the URL can linger in the
    # index as "Indexed, though blocked by robots.txt". A response header
    # applies at fetch time and works even for crawlers that do not
    # render JavaScript.
    #
    # NOTE: add_header inside a location block REPLACES the headers
    # inherited from the server block, so the security headers are
    # repeated here. Keep them in sync with the server block below.
    location /admin {
        try_files $uri $uri/ /index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # --- Static assets -------------------------------------------------
    # Vite emits content-hashed filenames, so these never change.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location /images/ {
        try_files $uri =404;
        expires 30d;
    }

    # --- Files that must not be cached ---------------------------------
    # index.html points at the hashed asset filenames, so a cached copy
    # would keep serving references to assets that no longer exist.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location = /robots.txt  { expires 1h; }
    location = /sitemap.xml { expires 1h; }

    # --- Security headers ----------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # --- Compression ---------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml application/xml;

    access_log /var/log/nginx/rml-frontend.access.log;
    error_log  /var/log/nginx/rml-frontend.error.log;
}

# Plain HTTP -> HTTPS (Caddy normally handles this; kept here so the site
# still works if nginx is reached directly).
server {
    listen 80;
    listen [::]:80;
    server_name refugeemigrationlab.org www.refugeemigrationlab.org;
    return 301 https://refugeemigrationlab.org$request_uri;
}

# www -> apex (permanent, so the ranking signals consolidate on one host).
# Caddy also has a redirect block for this; either one is enough.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.refugeemigrationlab.org;
    return 301 https://refugeemigrationlab.org$request_uri;
}
